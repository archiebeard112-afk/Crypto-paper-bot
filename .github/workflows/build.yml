name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test strategy and backtest
        run: ./gradlew :core:test
      - name: Build APK
        run: ./gradlew :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk CryptoPaperBot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoPaperBot
          path: CryptoPaperBot.apk
      - name: Publish as the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CryptoPaperBot.apk --title "Latest build (#${{ github.run_number }})" \
            --notes "Paper trading only. Install CryptoPaperBot.apk on your Android phone." --target "${{ github.sha }}"
