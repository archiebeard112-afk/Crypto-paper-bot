name: Screenshots

on:
  push:
    paths: ["app/**", "core/src/main/**", ".github/workflows/screenshots.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Render every screen with sample data
        run: ./gradlew :app:recordPaparazziDebug
      - name: Publish the images as the "screenshots" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete screenshots --yes --cleanup-tag || true
          gh release create screenshots app/src/test/snapshots/images/*.png --prerelease \
            --title "UI screenshots (${{ github.ref_name }} #${{ github.run_number }})" --notes "Rendered with sample data." --target "${{ github.sha }}"
